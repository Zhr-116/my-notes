<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾迹</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f2937" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <!-- 左侧：主页显示拾迹，子页面显示返回按钮 -->
      <div id="headerLeft">
        <h1 id="appTitle">拾迹</h1>
        <!-- 返回按钮，默认隐藏 -->
        <button id="subBackBtn" class="back-btn-icon" onclick="switchView('more')" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.793 19.793a.707.707 0 0 0 1.207-.5V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-6a1 1 0 0 1-1-1V4.707a.707.707 0 0 0-1.207-.5l-6.94 6.94a1.207 1.207 0 0 0 0 1.707z"/>
          </svg>
        </button>
      </div>

      <!-- 右侧：主页显示导航，子页面显示标题 -->
      <div id="headerRight">
        <div class="tabs" id="mainTabs">
          <button data-view="record" class="active">记录</button>
          <button data-view="timeline">时间轴</button>
          <button data-view="more">更多</button>
        </div>
        <span id="subPageTitle" class="sub-page-title" hidden>页面名</span>
      </div>
    </header>

    <section id="recordView">
      <div class="composer">
        <textarea id="contentInput" placeholder="今天做了什么？例如：写完个人陈述初稿"></textarea>
        <div class="row">
          <input type="date" id="dateInput" />
          <input type="text" id="tagsInput" placeholder="标签，用空格分隔，如 学习 比赛" />
          <button class="primary" id="saveBtn">保存</button>
        </div>
      </div>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="搜索内容、标签、详情..." />
        <div class="tag-bar" id="tagBar"></div>
      </div>
      <div id="list"></div>
    </section>

    <!-- 新增：回顾页视图 -->
    <section id="reviewView" hidden>
      <div id="reviewContent"></div>
    </section>

    <section id="timelineView" hidden>
      <div id="timeline"></div>
    </section>

    <!-- 书架视图 -->
    <section id="bookView" hidden>
      <div class="book-toolbar">
        <input type="search" id="bookSearchInput" placeholder="搜索书名或作者..." />
        <select id="bookSortSelect" class="book-sort-select">
          <option value="time">最新加入</option>
          <option value="title">按书名</option>
          <option value="author">按作者</option>
        </select>
      </div>

      <div id="bookList" class="book-grid"></div>
      
      <!-- 新增：长按多选底部操作栏 -->
      <div id="bookSelectionBar" class="selection-bar" hidden>
        <span id="selectedCountText">已选择 0 本书</span>
        <button id="batchDeleteBtn" class="danger-btn" onclick="batchDeleteBooks()">删除</button>
        <button class="cancel-btn" onclick="exitSelectionMode()">取消</button>
      </div>

      <button id="addBookBtn" class="fab-btn" onclick="openBookModal()">+</button>
    </section>

    <!-- 沉浸式书页视图 -->
    <section id="bookReadView" class="book-read-page" hidden>
      <div id="bookPageContent" class="book-page-content">
        
        <!-- 顶部工具栏 -->
        <div class="book-read-header">
          <button class="back-btn" onclick="closeBookRead()">← 返回书架</button>
          <!-- 右侧按钮动态区 -->
          <div id="brHeaderActions">
            <button id="brEditBtn" class="primary" style="padding: 6px 12px; font-size: 13px;" onclick="startEditBookDetail()">编辑</button>
          </div>
        </div>

        <!-- 书籍信息区 -->
        <div class="book-read-info">
          <div id="brCover" class="br-cover"></div>
          <div class="br-meta">
            <h1 id="brTitle">书名</h1>
            <p id="brAuthor">作者</p>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
              <span id="brStatusBadge" class="status-badge"></span>
              <!-- 新增：标记读完按钮 -->
              <button id="brMarkReadBtn" class="page-btn-edit" style="font-size: 11px; padding: 2px 8px; border-color: #d1c7b8; color: #8c8273;" onclick="markBookAsRead()">标记为已读完</button>
            </div>
            <div id="brQuote" class="br-quote">金句</div>
          </div>
        </div>

        <div class="book-divider">✧ ✧ ✧</div>

        <!-- 内容区：阅读态 -->
        <div id="brTextView" class="paper-read-area"></div>

        <!-- 内容区：编辑态（默认隐藏，且去掉了底部按钮） -->
        <div id="brEditArea" hidden>
          <textarea id="brDetailInput" class="paper-textarea" placeholder="在此写下你的阅读心得..."></textarea>
        </div>

      </div>
    </section>

    <!-- 计划页视图 -->
    <section id="planView" hidden>
      <div id="countdownContainer"></div>
      <div id="taskContainer" class="task-section"></div>
    </section>

    <!-- 更多功能页 -->
    <section id="moreView" hidden>
      <div class="more-grid">
        <div class="more-card" onclick="switchView('review')">
          <span class="more-icon">📊</span>
          <span>回顾看板</span>
        </div>
        <div class="more-card" onclick="switchView('book')">
          <span class="more-icon">📚</span>
          <span>私人书架</span>
        </div>
        <div class="more-card" onclick="switchView('plan')">
          <span class="more-icon">🎯</span>
          <span>计划倒计时</span>
        </div>
        <div class="more-card" onclick="switchView('shop')">
          <span class="more-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.983 21.186a1 1 0 0 1-1.966 0 10 10 0 0 0-8.203-8.203 1 1 0 0 1 0-1.966 10 10 0 0 0 8.203-8.203 1 1 0 0 1 1.966 0 10 10 0 0 0 8.203 8.203 1 1 0 0 1 0 1.966 10 10 0 0 0-8.203 8.203"/></svg>
          </span>
          <span>拾光商店</span>
        </div>
      </div>
      
      <!-- 快捷设置：自定义首页 -->
      <div style="margin-top: 40px; padding: 20px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border);">
        <label style="font-size: 14px; font-weight: 600; color: var(--text-primary);">默认启动首页</label>
        <select id="defaultViewSelect" class="card-select" style="margin-top: 10px;" onchange="saveDefaultView(this.value)">
          <option value="record">记录</option>
          <option value="timeline">时间轴</option>
          <option value="review">回顾看板</option>
          <option value="book">私人书架</option>
          <option value="plan">计划倒计时</option>
        </select>
      </div>
    </section>

    <!-- 拾光商店页 -->
    <section id="shopView" hidden>
      <div id="shopContent"></div>
    </section>
    <!-- 开盲盒全屏遮罩 -->
    <div id="boxOverlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; flex-direction: column;">
      
      <!-- 抖动的大盲盒 -->
      <div id="openingBoxContainer" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;">
        <!-- 这里的内容由 JS 动态注入图片 -->
      </div>
      
      <!-- 结果展示区 -->
      <div id="boxResult" style="display: none; width: 320px; background: #fff; border-radius: 24px; padding: 40px 20px; text-align: center; flex-direction: column; align-items: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3);">
        <!-- 这里的内容由 JS 动态注入 -->
      </div>
      
    </div>

    <!-- 添加倒计时弹窗 -->
    <div id="countdownModal" class="modal-mask" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-date">设定目标倒计时</span>
          <button class="close-btn" onclick="closeCountdownModal()">×</button>
        </div>
        <div class="modal-edit-area">
          <input type="text" id="cdTitleInput" placeholder="目标名称（如：考研、生日、放假）" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none;">
          <input type="date" id="cdDateInput" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; outline: none;">
          <div class="modal-actions">
            <button class="primary" onclick="saveCountdown()">保存</button>
            <button onclick="closeCountdownModal()">取消</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 新增：添加书籍弹窗 -->
    <div id="bookModal" class="modal-mask" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-date">添加新书</span>
          <button class="close-btn" onclick="closeBookModal()">×</button>
        </div>
                <div class="modal-edit-area">
          <input type="text" id="bookTitleInput" placeholder="书名" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none;">
          <input type="text" id="bookAuthorInput" placeholder="作者（可选）" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none;">
          <select id="bookStatusInput" class="book-sort-select" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);">
            <option value="want">想读</option>
            <option value="reading" selected>在读</option>
            <option value="read">已读</option>
          </select>

          <!-- 新增：封面上传区 -->
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
            <label for="bookCoverInput" class="upload-btn" style="margin: 0; display: inline-flex; align-items: center; gap: 6px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
              上传封面
            </label>
            <input type="file" id="bookCoverInput" accept="image/*" style="display: none;">
            <img id="bookCoverPreview" style="width: 40px; height: 56px; object-fit: cover; border-radius: 4px; display: none; border: 1px solid var(--border);">
          </div>

          <textarea id="bookQuoteInput" maxlength="50" placeholder="最打动你的一句话 / 核心感悟（限50字）" ...></textarea>
          
          <div class="modal-actions">
            <button class="primary" onclick="saveBook()">上架</button>
            <button onclick="closeBookModal()">取消</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 卡片生成器（居中显示） -->
    <div id="cardGeneratorModal" class="card-modal-overlay" hidden>
      <div class="card-modal-container">
        <div class="modal-header">
          <span class="modal-date">生成分享卡片</span>
          <button class="close-btn" onclick="closeCardGenerator()">×</button>
        </div>

        <!-- 预览区 -->
        <div id="cardPreviewArea" class="card-preview-area">
          <div class="card-top">
            <span id="cardDateDisplay" class="card-date">2025.10.18</span>
            <span id="cardTagDisplay" class="card-tag">★ 大事</span>
          </div>
          <div class="card-body">
            <div id="cardContentDisplay" class="card-content">记录的内容</div>
            <div id="cardDetailDisplay" class="card-detail">感悟与细节...</div>
          </div>
          <!-- 图片容器 -->
          <div id="cardImageWrapper" class="card-image-wrapper" hidden>
          </div>
          <div class="card-footer">
            <span>拾迹 · 个人轨迹</span>
          </div>
        </div>

        <!-- 控制区 -->
        <div class="card-controls">
            <div class="control-row">
              <div class="control-group" style="flex: 1;">
                <label>卡片主题</label>
                <select id="cardThemeSelect" class="card-select">
                  <option value="minimal">极简明信片</option>
                  <option value="film">复古胶片</option>
                  <option value="ticket">极简票根</option>
                </select>
              </div>
              <div class="control-group" style="flex: 1;">
                <label>文字排版</label>
                <select id="cardTextSelect" class="card-select">
                  <option value="normal">现代无衬线</option>
                  <option value="literary">文艺衬线体</option>
                  <option value="kaiti">温柔楷体</option>
                </select>
              </div>
            </div>

          <div class="control-group">
            <label>微调感悟：</label>
            <textarea id="cardDetailInput" placeholder="写点什么在卡片上..."></textarea>
          </div>
          
          <div class="control-group" id="cardImageSelector" hidden>
            <label>选择配图：</label>
            <div id="cardImageOptions" class="image-options-grid"></div>
          </div>

          <button id="downloadCardBtn" class="primary" style="width: 100%; margin-top: 10px;">
            保存图片到相册
          </button>
        </div>
      </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal-mask" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <span id="modalDate" class="modal-date"></span>
          <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        
        <div id="modalContent" class="modal-body-text"></div>
        <div id="modalTags" class="tags"></div>
        
        <!-- 阅读态 -->
        <div id="detailViewMode" class="detail-view-mode">
          <div id="detailTextView" class="detail-text-block"></div>
          <div id="detailImagesView" class="detail-images-grid"></div> <!-- 新增：图片展示区 -->
          <!-- 新增这个按钮 -->
          <button class="edit-detail-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; border-color: var(--accent); color: var(--accent-text);" onclick="openCardGenerator()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.65 7.65a2 2 0 012.629-1.046l5.51 2.374a2 2 0 011.046 2.628l-3.957 9.184a2 2 0 01-2.628 1.046l-5.51-2.374a2 2 0 01-1.046-2.628z"/>
              <path d="M18 7.777V4a2 2 0 00-2-2h-6a2 2 0 00-2 2v10a2 2 0 001.137 1.805"/>
              <path d="m8 4.389-4.364.809a2 2 0 00-1.602 2.33l1.822 9.833a2 2 0 002.331 1.602l2.542-.47"/>
            </svg>
            生成分享卡片
          </button>
          <button id="editDetailBtn" class="edit-detail-btn" onclick="startEditDetail()" style="display: flex; align-items: center; justify-content: center; gap: 6px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
              <path d="m15 5 4 4"/>
            </svg>
            编辑详情
          </button>
        </div>

        <!-- 编辑态（默认隐藏） -->
        <div id="detailEditMode" class="modal-edit-area" hidden>
          <textarea id="modalDetailInput" placeholder="记录一些心得、背景或细节..."></textarea>
          
          <!-- 新增：图片上传区 -->
          <div class="image-upload-area">
            <label for="imageInput" class="upload-btn" style="display: inline-flex; align-items: center; gap: 6px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
              添加图片
            </label>
            <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
            <div id="editImagesPreview" class="detail-images-grid"></div>
          </div>

          <div class="modal-actions">
            <button class="primary" onclick="saveModalDetail()">保存</button>
            <button onclick="cancelEditDetail()">取消</button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <button id="exportMdBtn">导出 Markdown</button>
      <button id="exportJsonBtn">导出 JSON</button>
      <button id="importBtn">导入备份</button> <!-- 新增导入按钮 -->
      <input type="file" id="importFile" accept=".json" style="display: none;" />
    </footer>
  </div>

      <!-- 整书分享卡片生成器 -->
    <div id="bookCardModal" class="card-modal-overlay" hidden>
      <div class="card-modal-container">
        <div class="modal-header">
          <span class="modal-date">生成读书卡片</span>
          <button class="close-btn" onclick="closeBookCardModal()">×</button>
        </div>
        
        <!-- 预览区 -->
        <div id="bookCardPreview" class="book-card-preview">
          <div class="bcard-top">
            <span>READING NOTES</span>
            <span>✧ 阅</span>
          </div>
          <div class="bcard-info">
            <div id="bcardCover" class="bcard-cover"></div>
            <div class="bcard-meta">
              <h2 id="bcardTitle">书名</h2>
              <p id="bcardAuthor">作者</p>
            </div>
          </div>
          <div id="bcardQuote" class="bcard-quote">“金句”</div>
          <div id="bcardReview" class="bcard-review">读后感摘要...</div>
          <div class="bcard-footer">
            <span>拾迹 · 私人书房</span>
          </div>
        </div>

        <!-- 新增：自由编辑区 -->
        <div class="card-edit-inputs">
          <textarea id="bcardReviewInput" placeholder="挑选部分书评填入卡片（太长会不好看）..." style="height: 80px;"></textarea>
        </div>

        <div class="modal-actions" style="margin-top: 15px;">
          <button id="downloadBookCardBtn" class="primary" style="width: 100%;">保存图片到相册</button>
        </div>
      </div>
    </div>

  <!-- 新增：全屏图片预览 -->
  <div id="imagePreviewModal" class="image-preview-modal" hidden onclick="closeImagePreview()">
    <img id="imagePreviewImg" src="" alt="预览图">
  </div>

  <!-- 拾迹专属剧情对话框 -->
  <div id="storyOverlay" class="story-overlay" style="display: none;">
    <!-- 立绘：你的小女孩 -->
    <img src="./assets/girl-color.png" alt="拾迹" class="story-character">
    
    <!-- 羊皮纸对话框 -->
    <div class="story-dialog-box" onclick="handleStoryClick()">
      <div class="story-speaker">拾迹</div>
      <div class="story-text" id="storyText"></div>
      <div class="story-continue" id="storyContinue">▼</div>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/entry.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/milestone.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/review.js"></script>
  <script src="js/books.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/story.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
